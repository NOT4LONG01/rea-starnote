[package]
name = "starnote-desktop"
version = "1.0.3"
license = "MIT"
description = "REA-StarNote: notes, notebooks and PDFs, compatible with StarNote files"
edition = "2021"

[lib]
name = "starnote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Same minor as the locked @tauri-apps/* npm packages: the Tauri CLI refuses to build when they differ.
tauri = { version = "~2.12", features = [] }
# Native networking (no browser cross-origin rules) and "open in the system browser" for desktop sign-in
tauri-plugin-http = "~2.8"
tauri-plugin-opener = "~2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
byteorder = "1.5"
log = "0.4"
env_logger = "0.11"


# a smaller, leaner app: no debug symbols, whole-program optimisation (the Rust side is small; speed is the webview's)
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
