name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # the PDF export test validates its output with poppler and Pillow
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils python3-pil
      - run: npm ci
      - run: npm run check
